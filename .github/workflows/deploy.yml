name: Deploy (Reusable)

# Reusable deploy workflow: validates which Terragrunt stacks to apply for the
# requested service target, then runs terragrunt apply for each in order
# (max-parallel: 1 serialises the matrix).
#
# Design constraints:
#   - Zero invocations of `aws` in any `run:` step. All AWS interaction goes
#     through the aws-actions/configure-aws-credentials action. This was an
#     explicit requirement from the project owner.
#   - The service-to-stack map, infra repo coordinates, and tool versions are
#     hardcoded here. The deploy is SymAssist-specific and lives only in this
#     repo. Callers pass only: environment, image_tag, target.
#   - No account IDs, ARNs, or credentials are written here. Sensitive values
#     come from repository or organisation vars/secrets (OIDC_ROLE_ARN,
#     INFRA_TOKEN). The cross-account role is not one of them: the provider
#     Terragrunt generates assumes it, so it is defined in the infra repo.

on:
  workflow_call:
    inputs:
      environment:
        description: Target environment (dev | staging | prod)
        required: true
        type: string

      image_tag:
        description: Immutable image tag to deploy (e.g. v1.0.0 or dev-abc1234).
        required: true
        type: string

      target:
        description: >
          Which service(s) to deploy. Must be one of the keys in the internal
          service-stack map: backend-api | backend-queue-worker |
          voiceai-websocket | backend-all | ai-service | all.
          No default: the caller states what it is deploying.
        required: true
        type: string

    secrets:
      INFRA_TOKEN:
        description: >
          Read access to the infra repository, cloned before terragrunt runs.
          A manual dispatch reads it from this repository instead.
        required: false

  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

      image_tag:
        description: Image tag to deploy (e.g. dev-abc1234 or v1.0.0)
        required: true
        type: string

      target:
        description: Which service(s) to deploy
        required: true
        type: choice
        options:
          - backend-all
          - backend-api
          - backend-queue-worker
          - voiceai-websocket
          - ai-service
          - all

# One deploy per environment at a time.
# cancel-in-progress: false is MANDATORY with Terraform: two concurrent applies
# compete for the S3 state lock and one will fail mid-apply, potentially leaving
# resources in an inconsistent state. A queued deploy waits instead of canceling.
# The rollout is waited on by Terraform (wait_for_steady_state), not by
# aws-actions/amazon-ecs-deploy-task-definition. That action is gone, and with
# it the false-red failures documented in 77447df: its AWS SDK v2
# `servicesStable` waiter reported "Resource is not in the state servicesStable"
# at 18s and 37s on services that reached steady state moments later, and it
# exposed no way to delay its first poll. The workaround was a 30s sleep before
# each deploy step; it is not carried over because the waiter it worked around
# no longer runs. Three occurrences on 2026-08-27, plus four re-runs of the same
# commit that night — see that commit for the full ruling-out of timeout,
# draining, stale deployments and blue/green.
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  ENV_NAME:        ${{ inputs.environment }}
  TF_VERSION:      "1.10.5"
  TG_VERSION:      "0.93.5"
  INFRA_REPO:      Braintly/infra
  INFRA_BASE_PATH: SymAssist

jobs:
  # Validate the request and resolve the stack list for the deploy matrix.
  #
  # Why detect still exists (simplified, not eliminated):
  #   The old detect job resolved the tag from a workflow_run artifact and
  #   diffed git to map changed paths to stacks. Both concerns are gone: the
  #   tag is now always an explicit input, and path-detection was only needed
  #   by the workflow_run trigger (the old separate deploy.yml in each service
  #   repo). The caller — now the build reusable — already knows what was
  #   built and passes an explicit target.
  #   What remains is still worth a dedicated job:
  #     1. The immutable-tag guard for prod/staging must run before any deploy
  #        step, before the matrix expands.
  #     2. Resolving the target to a stack list and failing fast with a clear
  #        error is better done once here than duplicated across matrix shards.
  detect:
    runs-on: ubuntu-latest
    outputs:
      stacks: ${{ steps.decide.outputs.stacks }}
    steps:
      # Protected environments (prod/staging) must NEVER deploy a moving tag.
      # `latest-dev` is overwritten by every dev push, so deploying it to prod
      # ships whatever dev built last (root cause of the DEVSYM-408 prod
      # incident). Require an immutable tag: the vX.Y.Z tag from a GitHub
      # release, a dev-<short-sha> build tag, or an explicit sha256 digest.
      - name: Enforce immutable image tag for protected environments
        if: inputs.environment == 'prod' || inputs.environment == 'staging'
        run: |
          TAG="${{ inputs.image_tag }}"
          if [[ "$TAG" =~ ^[0-9]{14}-[a-z0-9._-]+$ ]] || \
             [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || \
             [[ "$TAG" =~ ^sha256:[0-9a-f]{64}$ ]] || \
             [[ "$TAG" =~ ^dev-[0-9a-f]{7,}$ ]]; then
            echo "OK: '$TAG' is an immutable tag for '${{ inputs.environment }}'."
          else
            echo "::error::Refusing to deploy moving tag '$TAG' to '${{ inputs.environment }}'." \
              "Protected environments require an immutable image tag — a vX.Y.Z release tag" \
              "(e.g. v1.0.6), a dev-<sha> build tag (e.g. dev-abc1234)," \
              "a YYYYMMDDHHMMSS-<suffix> tag, or a sha256:<digest> — never latest-dev/latest."
            exit 1
          fi

      - id: decide
        name: Resolve stack list for target
        run: |
          set -euo pipefail

          TARGET="${{ inputs.target }}"
          TARGET="${TARGET:-all}"

          # Service-to-stack map. Apply order matters: compute must precede
          # queue-worker and voiceai-ws because those inherit container_image
          # from the compute Terragrunt state output. compute-ai is independent.
          case "$TARGET" in
            backend-api)          STACKS='["compute"]' ;;
            backend-queue-worker) STACKS='["compute","queue-worker"]' ;;
            voiceai-websocket)    STACKS='["compute","voiceai-ws"]' ;;
            backend-all)          STACKS='["compute","queue-worker","voiceai-ws"]' ;;
            ai-service)           STACKS='["compute-ai"]' ;;
            all)                  STACKS='["compute","queue-worker","voiceai-ws","compute-ai"]' ;;
            *)
              echo "::error::Unknown target '$TARGET'." \
                "Available targets: backend-api, backend-queue-worker, voiceai-websocket, backend-all, ai-service, all"
              exit 1
              ;;
          esac

          echo "stacks=$STACKS" >> "$GITHUB_OUTPUT"
          echo "Target '$TARGET' -> stacks $STACKS"

  # Deploy each Terragrunt stack in order (max-parallel: 1 serialises the matrix).
  # compute always runs first — queue-worker and voiceai-ws inherit container_image
  # from its Terragrunt state output. Terraform itself runs the database migration
  # (terraform_data.migrate in modules/root/compute) before updating the ECS service,
  # and wait_for_steady_state = true replaces the old aws ecs wait services-stable.
  deploy:
    needs: detect
    if: needs.detect.result == 'success'
    name: Deploy ${{ matrix.stack }} to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 45
    strategy:
      matrix:
        stack: ${{ fromJson(needs.detect.outputs.stacks) }}
      max-parallel: 1

    steps:
      # Checkout the infra repo to run Terragrunt.
      # SETUP REQUIRED: store a token with read access to Braintly/infra as the
      # INFRA_TOKEN secret in this repository (or at organisation level).
      # Scope it to `repo` on a fine-grained token limited to that repo.
      # persist-credentials: false keeps the token out of the checkout's git config.
      - name: Checkout infra repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INFRA_REPO }}
          token: ${{ secrets.INFRA_TOKEN }}
          path: infra
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Installed straight from the release rather than through a third-party
      # action: the version is pinned above, the download is two lines, and
      # there is no action contract to keep up with.
      - name: Set up Terragrunt
        run: |
          curl -fsSL -o /tmp/terragrunt \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${{ env.TG_VERSION }}/terragrunt_linux_amd64"
          sudo install -m 0755 /tmp/terragrunt /usr/local/bin/terragrunt
          terragrunt --version

      # Entry credentials only. The cross-account role is assumed by the
      # provider Terragrunt generates, so the role lives in one place — the
      # infra repo — and behaves the same here as it does on a workstation.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Apply ${{ matrix.stack }} stack
        working-directory: infra/${{ env.INFRA_BASE_PATH }}/${{ env.ENV_NAME }}/${{ matrix.stack }}
        env:
          CONTAINER_IMAGE_TAG: ${{ inputs.image_tag }}
        run: terragrunt apply --non-interactive --auto-approve

      - name: Summary
        run: |
          echo "### Deployed \`${{ matrix.stack }}\` to \`${{ env.ENV_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image tag:** \`${{ inputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Stack:** \`${{ env.INFRA_BASE_PATH }}/${{ env.ENV_NAME }}/${{ matrix.stack }}\`" >> $GITHUB_STEP_SUMMARY
